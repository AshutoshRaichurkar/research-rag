[project]
name = "research-rag"
version = "0.1.0"
description = "arXiv Paper Curator: question answering over research papers with cited answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17,<0.18",  # pinned so local and CI format code the same way
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lint and format only product code and tests (notebooks are scratch work; course/ is docs).
extend-exclude = ["notebooks", "course"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
